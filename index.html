<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fireworks</title>
  <style>
    :root {
      --bg0: #03050d;
      --bg1: #090f1f;
      --bg2: #11192e;
      --panel: rgba(9, 13, 25, 0.56);
      --line: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.94);
      --muted: rgba(255,255,255,0.68);
      --gold: #ffe08a;
      --pink: #ff93c5;
      --cyan: #78e8ff;
      --violet: #a38bff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 18%, rgba(163,139,255,0.22), transparent 20%),
        radial-gradient(circle at 82% 14%, rgba(120,232,255,0.12), transparent 18%),
        radial-gradient(circle at 74% 82%, rgba(255,147,197,0.12), transparent 18%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 50%, var(--bg2));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 15%, rgba(255,255,255,0.18) 0 1px, transparent 2px),
        radial-gradient(circle at 18% 78%, rgba(255,255,255,0.12) 0 1px, transparent 2px),
        radial-gradient(circle at 28% 36%, rgba(255,255,255,0.10) 0 1px, transparent 2px),
        radial-gradient(circle at 46% 24%, rgba(255,255,255,0.12) 0 1px, transparent 2px),
        radial-gradient(circle at 64% 18%, rgba(255,255,255,0.10) 0 1px, transparent 2px),
        radial-gradient(circle at 78% 56%, rgba(255,255,255,0.10) 0 1px, transparent 2px),
        radial-gradient(circle at 92% 12%, rgba(255,255,255,0.16) 0 1px, transparent 2px),
        radial-gradient(circle at 90% 78%, rgba(255,255,255,0.14) 0 1px, transparent 2px);
      opacity: 0.8;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    .topbar,
    .bottombar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.24);
      color: var(--text);
      font-size: 13px;
    }

    .card strong {
      letter-spacing: 0.08em;
      color: var(--gold);
      font-size: 12px;
      text-transform: uppercase;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .center-copy {
      pointer-events: none;
      display: grid;
      place-items: center;
      align-self: center;
      text-align: center;
      padding: 16px 18px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 44px rgba(0,0,0,0.24);
      min-width: min(540px, 92vw);
      max-width: 92vw;
      backdrop-filter: blur(16px);
      margin-top: 8vh;
    }

    .title {
      margin: 0;
      font-size: clamp(26px, 4vw, 52px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: 0.02em;
      background: linear-gradient(180deg, #fff, #ffe9a8 45%, #ffd0e4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 12px 30px rgba(0,0,0,0.28);
      animation: float 4s ease-in-out infinite;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 18px);
      line-height: 1.75;
    }

    button {
      pointer-events: auto;
      border: none;
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 800;
      color: #111;
      background: linear-gradient(135deg, #ffe28a, #ff9ecb 45%, #9fe9ff);
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(0,0,0,0.22);
      transition: transform .18s ease, filter .18s ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.03); }
    button:active { transform: translateY(1px) scale(0.99); }

    .secondary {
      color: #fff;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.07));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (max-width: 720px) {
      .hud { padding: 12px; }
      .center-copy { min-width: 0; margin-top: 18vh; }
      .topbar, .bottombar { align-items: flex-start; }
      .card { padding: 9px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .title { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>

  <div class="hud">
    <div class="topbar">
      <div class="card"><strong>Fireworks</strong><span class="hint">点击空白处放烟花</span></div>
      <div class="card"><span class="hint">空格键：大波烟花 · A：自动开关</span></div>
    </div>

    <div class="center-copy">
      <h1 class="title">Tonight, the sky is yours.</h1>
      <p class="subtitle">纯烟花版：没有生日、没有表单、没有多余内容。<br />
        你只需要点击屏幕，或者按下空格键，看夜空一次次炸开。</p>
    </div>

    <div class="bottombar">
      <div class="card"><span class="hint">鼠标 / 触控 / 空格都可以触发</span></div>
      <button id="toggleAuto" type="button">自动：开</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');
    const toggleAutoBtn = document.getElementById('toggleAuto');

    const rockets = [];
    const particles = [];
    const stars = [];
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let autoMode = !reduceMotion;
    let frame = 0;
    let dpr = 1;
    let autoTimer = null;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (!stars.length) {
        const count = reduceMotion ? 48 : 72;
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight * 0.7,
            r: 0.35 + Math.random() * 1.2,
            a: 0.18 + Math.random() * 0.45,
            tw: Math.random() * Math.PI * 2
          });
        }
      }
    }

    function palette() {
      const hues = [35, 48, 58, 120, 160, 192, 218, 246, 292, 332];
      return hues[Math.floor(Math.random() * hues.length)];
    }

    function launchRocket(targetX, targetY, hue = palette()) {
      if (rockets.length > 6) rockets.shift();

      const startX = window.innerWidth * (0.18 + Math.random() * 0.64);
      const startY = window.innerHeight + 28 + Math.random() * 24;
      const dx = targetX - startX;
      const dy = targetY - startY;
      const dist = Math.max(1, Math.hypot(dx, dy));
      const speed = 6.4 + Math.random() * 2.2;

      rockets.push({
        x: startX,
        y: startY,
        vx: (dx / dist) * speed,
        vy: (dy / dist) * speed,
        targetX,
        targetY,
        hue,
        trail: []
      });
    }

    function explode(x, y, hue, scale = 1) {
      const ringA = reduceMotion ? 18 : 28;
      const ringB = reduceMotion ? 8 : 14;

      const rings = [
        { count: Math.floor(ringA * scale), speed: 2.0, spread: 0.24, life: 0.98 },
        { count: Math.floor(ringB * scale), speed: 3.4, spread: 0.14, life: 0.88 }
      ];

      rings.forEach((ring, idx) => {
        for (let i = 0; i < ring.count; i++) {
          const angle = (Math.PI * 2 * i) / ring.count + (Math.random() - 0.5) * ring.spread;
          const speed = ring.speed + Math.random() * (idx === 0 ? 1.6 : 1.1);
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            hue: (hue + Math.random() * 18 - 9 + 360) % 360,
            life: ring.life,
            decay: 0.014 + Math.random() * 0.01,
            size: 1 + Math.random() * 1.8,
            sparkle: Math.random() > 0.68,
            drift: (Math.random() - 0.5) * 0.008
          });
        }
      });

      for (let i = 0; i < (reduceMotion ? 4 : 6); i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.7 + Math.random() * 1.3;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          hue: (hue + 16) % 360,
          life: 0.78,
          decay: 0.022 + Math.random() * 0.01,
          size: 0.8 + Math.random() * 1.1,
          sparkle: true,
          drift: (Math.random() - 0.5) * 0.012
        });
      }
    }

    function burstAt(x, y) {
      const base = palette();
      launchRocket(x, y, base);
      if (Math.random() > 0.28) launchRocket(x - 90 + Math.random() * 180, y - 36 + Math.random() * 70, base + 12);
      if (Math.random() > 0.60) launchRocket(x - 120 + Math.random() * 240, y - 60 + Math.random() * 120, base - 14);
    }

    function randomBurst() {
      const x = 90 + Math.random() * (window.innerWidth - 180);
      const y = 110 + Math.random() * (window.innerHeight * 0.4);
      burstAt(x, y);
    }

    function draw() {
      frame += 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(3, 5, 13, 0.24)';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      for (const s of stars) {
        s.tw += 0.012;
        ctx.fillStyle = `rgba(255,255,255,${s.a + Math.sin(s.tw) * 0.14})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalCompositeOperation = 'lighter';

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.trail.push({ x: r.x, y: r.y });
        if (r.trail.length > 12) r.trail.shift();

        for (let t = 1; t < r.trail.length; t++) {
          const a = r.trail[t - 1];
          const b = r.trail[t];
          ctx.strokeStyle = `hsla(${r.hue}, 100%, 70%, ${t / r.trail.length * 0.38})`;
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }

        r.vy += 0.006;
        r.x += r.vx;
        r.y += r.vy;

        const dx = r.targetX - r.x;
        const dy = r.targetY - r.y;
        if (Math.hypot(dx, dy) < 18 || r.y < r.targetY - 10) {
          explode(r.x, r.y, r.hue, 1 + Math.random() * 0.25);
          rockets.splice(i, 1);
          continue;
        }

        ctx.shadowColor = `hsla(${r.hue}, 100%, 72%, 0.9)`;
        ctx.shadowBlur = 8;
        ctx.fillStyle = `hsla(${r.hue}, 100%, 72%, 0.96)`;
        ctx.beginPath();
        ctx.arc(r.x, r.y, 2.1, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vx *= 0.989;
        p.vy *= 0.989;
        p.vy += 0.022;
        p.vx += p.drift;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        const alpha = Math.max(0, p.life);
        const flicker = p.sparkle ? 0.72 + Math.sin(frame * 0.24 + i) * 0.2 : 1;
        ctx.shadowColor = `hsla(${p.hue}, 100%, 74%, ${alpha})`;
        ctx.shadowBlur = p.sparkle ? 8 : 5;
        ctx.fillStyle = `hsla(${p.hue}, 100%, ${p.sparkle ? 74 : 64}%, ${alpha * flicker})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    function setAutoMode(next) {
      autoMode = next;
      toggleAutoBtn.textContent = autoMode ? '自动：开' : '自动：关';
    }

    function startAuto() {
      autoTimer = setInterval(() => {
        if (!autoMode) return;
        randomBurst();
      }, reduceMotion ? 3200 : 2400);
    }

    document.addEventListener('pointerdown', (event) => {
      const tag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : '';
      if (tag === 'button' || tag === 'input' || tag === 'textarea' || tag === 'label') return;
      burstAt(event.clientX, event.clientY);
      if (!reduceMotion && Math.random() > 0.6) burstAt(event.clientX + 70, event.clientY - 24);
    });

    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        burstAt(window.innerWidth * (0.24 + Math.random() * 0.52), window.innerHeight * (0.14 + Math.random() * 0.22));
      }
      if (event.key && event.key.toLowerCase() === 'a') {
        setAutoMode(!autoMode);
      }
    });

    toggleAutoBtn.addEventListener('click', () => setAutoMode(!autoMode));
    window.addEventListener('resize', resize);

    resize();
    draw();
    startAuto();

    setTimeout(() => {
      burstAt(window.innerWidth * 0.28, window.innerHeight * 0.24);
      burstAt(window.innerWidth * 0.52, window.innerHeight * 0.16);
      burstAt(window.innerWidth * 0.74, window.innerHeight * 0.23);
    }, 400);
  </script>
</body>
</html>
